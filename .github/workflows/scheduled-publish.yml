name: 定时公布版本

on:
  schedule:
    # 0 16 19 8 * 对应 UTC 16:00 (北京时间 8月20日 00:00)
    # 若需北京时间 04:00 发布，UTC 对应为 20:00，即 '0 20 19 8 *'
    - cron: '0 20 19 8 *'
  workflow_dispatch:

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须显式声明 write 权限，否则无法读取 Draft 也无法修改 Release
    steps:
      - name: 检查待发布的草稿并自动转为正式公开版
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const draftRelease = releases.data.find(r => r.draft === true);
            
            if (draftRelease) {
              console.log(`正在公布版本: ${draftRelease.name || draftRelease.tag_name}`);
              
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                draft: false,
                make_latest: 'true'
              });
              
              console.log('🎉 定时发布成功！');
            } else {
              console.log('未检测到待发布的草稿 (Draft)，跳过发布。');
            }
